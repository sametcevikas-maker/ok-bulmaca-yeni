
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ok Bulmacası</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1020;color:#f4f7ff;font-family:Arial,sans-serif}
.app{max-width:620px;margin:auto;padding:16px}
header,.top,.buttons{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:25px;margin:8px 0}
p{color:#aab8d0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat,.panel{background:#131d32;border:1px solid #2a3a57;border-radius:15px;padding:12px;text-align:center}
.stat strong{display:block;font-size:20px;margin-top:5px}
.panel{text-align:left;padding:14px}
#board{width:100%;aspect-ratio:1;position:relative;overflow:hidden;border-radius:12px;background-color:#eaf1fb;background-image:radial-gradient(#a7b9d2 1px,transparent 1px);background-size:13px 13px;touch-action:manipulation}
.arrow{position:absolute;display:grid;place-items:center;border:0;background:transparent;color:#121b30;padding:0;cursor:pointer}
.arrow svg{width:100%;height:100%;overflow:visible}
.arrow:active{scale:.86}
button{border:1px solid #405474;border-radius:12px;background:#223554;color:white;padding:12px;font-size:14px;font-weight:bold}
.primary{background:#347cf0}
.buttons{display:grid;grid-template-columns:1fr 1fr;margin-top:12px}
.buttons button{width:100%}
#msg{text-align:center;min-height:40px;padding:12px 2px;color:#c9d8ee}
footer{text-align:center;color:#8192ae;font-size:12px;margin:16px 0}
</style>
</head>
<body>
<main class="app">
<header><div><h1>➜ Ok Bulmacası</h1><p>Oku seç, yolunu aç, tahtadan kaçır.</p></div><button id="restart">↻</button></header>
<section class="stats">
<div class="stat">SEVİYE<strong id="lev">1 / 12</strong></div>
<div class="stat">HAMLE<strong id="moves">0</strong></div>
<div class="stat">ÇIKAN OK<strong id="gone">0</strong></div>
</section>
<section class="panel">
<div class="top"><div><b id="title">Seviye 1</b><p id="remaining">Oklar hazırlanıyor</p></div></div>
<div id="board"></div>
<div id="msg">Önü açık bir oka dokun!</div>
<div class="buttons">
<button class="primary" id="hint">💡 İpucu</button>
<button id="reset">↻ Sıfırla</button>
<button id="help">❔ Nasıl oynanır</button>
<button id="next" style="display:none">Sonraki seviye →</button>
</div>
</section>
<footer>Telefon ve bilgisayarda oynanabilir</footer>
</main>
<script>
const configs=[
[5,13,'diamond'],[6,19,'cross'],[6,22,'maze'],
[7,27,'diamond'],[7,31,'cross'],[8,38,'maze'],
[8,43,'diamond'],[9,49,'cross'],[9,55,'maze'],
[10,62,'diamond'],[10,70,'cross'],[11,82,'maze']
];
const dirs=[[-1,0,0],[0,1,90],[1,0,180],[0,-1,270]];
let level=0,arrows=[],moves=0,cleared=0,won=false;
const el=id=>document.getElementById(id);
function shape(r,c,n,s){
 let x=(c-(n-1)/2)/((n+1)/2),y=(r-(n-1)/2)/((n+1)/2);
 if(s==='diamond')return Math.abs(x)+Math.abs(y)<1.17;
 if(s==='cross')return Math.abs(x)<.39||Math.abs(y)<.39;
 return !((r<2||r>n-3)&&(c<2||c>n-3))&&
 !((r===2||r===n-3)&&(c===2||c===n-3));
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function clear(a,live,n){
 let [dr,dc]=dirs[a.d],r=a.r+dr,c=a.c+dc;
 while(r>=0&&r<n&&c>=0&&c<n){
  if(live.some(b=>b.alive&&b.r===r&&b.c===c))return false;
  r+=dr;c+=dc;
 }
 return true;
}
function solution(){
 let live=arrows.filter(a=>a.alive).slice(),order=[];
 while(live.length){
  let a=live.find(a=>clear(a,live,configs[level][0]));
  if(!a)return null;
  order.push(a);live=live.filter(b=>b!==a);
 }
 return order;
}
function generate(){
 let [n,count,s]=configs[level],cells=[];
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(shape(r,c,n,s))cells.push({r,c});
 let chosen=shuffle(cells).slice(0,Math.min(count,cells.length));
 let order=shuffle(chosen.slice());
 arrows=chosen.map((p,id)=>({r:p.r,c:p.c,id,d:0,alive:true}));
 // Her ok için, kendisinden sonra çıkarılacak okları engellemeyen bir yön seç.
 order.forEach((a,k)=>{
  let later=order.slice(k+1);
  let options=[0,1,2,3].filter(d=>{
   let [dr,dc]=dirs[d],r=a.r+dr,c=a.c+dc;
   while(r>=0&&r<n&&c>=0&&c<n){
    if(later.some(b=>b.r===r&&b.c===c))return false;
    r+=dr;c+=dc;
   }
   return true;
  });
  a.d=options[Math.floor(Math.random()*options.length)];
 });
 moves=0;cleared=0;won=false;render();
}
function svg(){
 return '<svg viewBox="0 0 40 40"><path d="M20 36V8M9 19L20 8 31 19" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function render(){
 let [n]=configs[level],board=el('board');board.innerHTML='';
 let size=100/n;
 arrows.filter(a=>a.alive).forEach(a=>{
  let b=document.createElement('button');b.className='arrow';b.innerHTML=svg();
  b.style.left=(a.c*size+size*.08)+'%';b.style.top=(a.r*size+size*.08)+'%';
  b.style.width=(size*.84)+'%';b.style.height=(size*.84)+'%';
  b.style.transform='rotate('+dirs[a.d][2]+'deg)';
  b.setAttribute('aria-label','Ok '+(a.r+1)+','+(a.c+1));
  b.onclick=()=>tap(a.id);board.appendChild(b);
 });
 el('lev').textContent=(level+1)+' / '+configs.length;
 el('title').textContent='Seviye '+(level+1);
 el('moves').textContent=moves;el('gone').textContent=cleared;
 el('remaining').textContent=(arrows.length-cleared)+' ok kaldı';
 el('next').style.display=won?'block':'none';
 el('next').textContent=level===configs.length-1?'Baştan oyna ↻':'Sonraki seviye →';
}
function say(t){el('msg').textContent=t}
function tap(id){
 if(won)return;
 let a=arrows.find(x=>x.id===id&&x.alive);if(!a)return;
 moves++;
 if(clear(a,arrows,configs[level][0])){
  a.alive=false;cleared++;say('✓ Güzel hamle! Bir yol daha açıldı.');
  if(cleared===arrows.length){won=true;say('🎉 Harika! Bulmacayı çözdün!');}
 }else say('⛔ Bu okun yolu kapalı. Önündeki oku önce çıkar.');
 render();
}
function reset(){generate();say('Yeni tahta hazır. İlk açık oku bul!')}
el('restart').onclick=reset;el('reset').onclick=reset;
el('hint').onclick=()=>{
 let a=solution()?.[0];
 if(!a){say('Yeni bir tahta hazırlanıyor.');reset();return;}
 say('İpucu: '+(a.r+1)+'. satır, '+(a.c+1)+'. sütundaki oku dene.');
 let b=[...el('board').children].find(b=>b.getAttribute('aria-label')==='Ok '+(a.r+1)+','+(a.c+1));
 if(b){b.style.color='#0e9f6e';setTimeout(()=>{b.style.color=''},1200);}
};
el('help').onclick=()=>say('Her ok baktığı yönde düz ilerler. Önünde ok varsa çıkamaz. Önce yolu açık okları kaldır.');
el('next').onclick=()=>{level=(level+1)%configs.length;generate();say('Yeni seviye başladı!');};
generate();
</script>
</body>
</html>
